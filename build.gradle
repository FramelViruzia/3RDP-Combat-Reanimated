plugins {
    // 1.16 because EMF/ETF jars from Modrinth were built with Loom 1.15+ (needs Gradle 9.4+, Java 21)
    id 'fabric-loom' version '1.16.3'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'RedlanceMinecraft'
        url = 'https://repo.redlance.org/public'
        content {
            includeGroupAndSubgroups 'com.zigythebird'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Required at runtime; players install these themselves (declared in fabric.mod.json)
    modImplementation("com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.pal_version}") {
        // The Fabric jar already contains the core classes
        exclude group: 'com.zigythebird.playeranim', module: 'PlayerAnimationLibCore'
    }
    modImplementation "maven.modrinth:entity-model-features:${project.emf_version}"
    modImplementation "maven.modrinth:entitytexturefeatures:${project.etf_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
